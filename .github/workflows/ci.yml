name: CI

# Provider integration uses throwaway database containers with credentials
# generated at runtime. No repository secrets are required, so the workflow
# also works for pull requests from forks.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    name: Build, unit tests, vulnerability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.402"

      - name: Restore
        run: dotnet restore Mecesoft.Data.sln

      - name: Build Release
        run: dotnet build Mecesoft.Data.sln -c Release --no-restore

      - name: Abstractions tests
        run: dotnet test tests/Mecesoft.Data.Tests/Mecesoft.Data.Tests.csproj -c Release --no-build

      - name: EF Core tests
        run: dotnet test tests/Mecesoft.Data.EntityFrameworkCore.Tests/Mecesoft.Data.EntityFrameworkCore.Tests.csproj -c Release --no-build

      - name: Vulnerability audit
        shell: bash
        run: |
          set -euo pipefail
          dotnet list Mecesoft.Data.sln package --vulnerable --include-transitive --format json > vulnerability-report.json
          if ! jq -e '[.. | objects | .vulnerabilities? // empty] | length == 0' vulnerability-report.json > /dev/null; then
            echo "Vulnerable packages detected:"
            jq -r '.. | objects | select(has("vulnerabilities")) | "\(.id) \(.resolvedVersion // .requestedVersion // "unknown"): \(.vulnerabilities[].severity)"' vulnerability-report.json
            exit 1
          fi
          echo "No vulnerable packages found."

  provider-integration:
    name: SQL Server and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.402"

      - name: Start database containers
        shell: bash
        run: |
          set -euo pipefail
          sqlserver_password="$(openssl rand -base64 32 | tr -d '\n' | tr '/+=' 'XyZ')Aa1!"
          postgres_password="$(openssl rand -hex 24)"
          echo "::add-mask::$sqlserver_password"
          echo "::add-mask::$postgres_password"
          {
            echo "MECESOFT_CI_SQLSERVER_PASSWORD=$sqlserver_password"
            echo "MECESOFT_CI_POSTGRES_PASSWORD=$postgres_password"
          } >> "$GITHUB_ENV"

          docker run --detach --name mecesoft-ci-sqlserver \
            --env ACCEPT_EULA=Y \
            --env MSSQL_SA_PASSWORD="$sqlserver_password" \
            --publish 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

          docker run --detach --name mecesoft-ci-postgres \
            --env POSTGRES_PASSWORD="$postgres_password" \
            --publish 5432:5432 \
            postgres:17

      - name: Wait for SQL Server
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            running=$(docker inspect --format '{{.State.Running}}' mecesoft-ci-sqlserver 2>/dev/null || echo false)
            if [[ "$running" != "true" ]]; then
              docker logs mecesoft-ci-sqlserver 2>&1 | tail -50
              echo "SQL Server container exited before becoming ready"
              exit 1
            fi
            if docker exec mecesoft-ci-sqlserver /opt/mssql-tools18/bin/sqlcmd \
                -S localhost -U sa -P "$MECESOFT_CI_SQLSERVER_PASSWORD" -C -Q 'SELECT 1' >/dev/null 2>&1; then
              echo "SQL Server ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          docker logs mecesoft-ci-sqlserver 2>&1 | tail -50
          echo "SQL Server did not become ready"
          exit 1

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            running=$(docker inspect --format '{{.State.Running}}' mecesoft-ci-postgres 2>/dev/null || echo false)
            if [[ "$running" != "true" ]]; then
              docker logs mecesoft-ci-postgres 2>&1 | tail -50
              echo "PostgreSQL container exited before becoming ready"
              exit 1
            fi
            if docker exec mecesoft-ci-postgres pg_isready -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          docker logs mecesoft-ci-postgres 2>&1 | tail -50
          echo "PostgreSQL did not become ready"
          exit 1

      - name: Restore
        run: dotnet restore Mecesoft.Data.sln

      - name: Build Release
        run: dotnet build Mecesoft.Data.sln -c Release --no-restore

      - name: SQL Server tests
        shell: bash
        run: |
          export MECESOFT_SQLSERVER_TEST_CONNECTION="Server=127.0.0.1,1433;Database=master;User Id=sa;Password=${MECESOFT_CI_SQLSERVER_PASSWORD};TrustServerCertificate=True;Encrypt=True;Connect Timeout=30"
          dotnet test tests/Mecesoft.Data.EntityFrameworkCore.SqlServer.Tests/Mecesoft.Data.EntityFrameworkCore.SqlServer.Tests.csproj -c Release --no-build

      - name: PostgreSQL tests
        shell: bash
        run: |
          export MECESOFT_POSTGRES_TEST_CONNECTION="Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=${MECESOFT_CI_POSTGRES_PASSWORD};Timeout=30"
          dotnet test tests/Mecesoft.Data.EntityFrameworkCore.PostgreSql.Tests/Mecesoft.Data.EntityFrameworkCore.PostgreSql.Tests.csproj -c Release --no-build

      - name: Stop database containers
        if: always()
        run: docker rm --force mecesoft-ci-sqlserver mecesoft-ci-postgres || true

  pack:
    name: Pack and validate NuGet packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ build-test, provider-integration ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.402"

      - name: Restore
        run: dotnet restore Mecesoft.Data.sln

      - name: Pack
        env:
          CI: "true"
        run: |
          mkdir -p artifacts/packages
          dotnet pack src/Mecesoft.Data.Abstractions/Mecesoft.Data.Abstractions.csproj -c Release --no-restore -o artifacts/packages
          dotnet pack src/Mecesoft.Data.EntityFrameworkCore/Mecesoft.Data.EntityFrameworkCore.csproj -c Release --no-restore -o artifacts/packages
          dotnet pack src/Mecesoft.Data.EntityFrameworkCore.SqlServer.Tenancy/Mecesoft.Data.EntityFrameworkCore.SqlServer.Tenancy.csproj -c Release --no-restore -o artifacts/packages
          dotnet pack src/Mecesoft.Data.EntityFrameworkCore.PostgreSql.Tenancy/Mecesoft.Data.EntityFrameworkCore.PostgreSql.Tenancy.csproj -c Release --no-restore -o artifacts/packages

      - name: Validate package contents and SourceLink
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: Mecesoft/Mecesoft.Data
        run: |
          set -euo pipefail
          cd artifacts/packages
          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' ../../Directory.Build.props | head -n1)"
          test -n "$version"

          test "$(find . -maxdepth 1 -name '*.nupkg' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -name '*.snupkg' | wc -l)" -eq 4

          expected_packages=(
            "Mecesoft.Data.Abstractions.${version}.nupkg"
            "Mecesoft.Data.EntityFrameworkCore.${version}.nupkg"
            "Mecesoft.Data.EntityFrameworkCore.SqlServer.Tenancy.${version}.nupkg"
            "Mecesoft.Data.EntityFrameworkCore.PostgreSql.Tenancy.${version}.nupkg"
          )

          for package in "${expected_packages[@]}"; do
            if [[ ! -f "$package" ]]; then
              echo "$package: package file is missing"
              exit 1
            fi

            nuspec=$(unzip -p "$package" '*.nuspec')
            expected_id="${package%.${version}.nupkg}"

            if ! grep -q "<id>${expected_id}</id>" <<<"$nuspec"; then
              echo "$package: package id ${expected_id} is missing"
              exit 1
            fi

            if ! grep -q "<version>${version}</version>" <<<"$nuspec"; then
              echo "$package: version ${version} is missing"
              exit 1
            fi

            if ! grep -q '<repository type="git" url="https://github.com/Mecesoft/Mecesoft.Data"' <<<"$nuspec"; then
              echo "$package: repository URL is missing"
              exit 1
            fi

            if ! grep -q "commit=\"${GITHUB_SHA}\"" <<<"$nuspec"; then
              echo "$package: repository commit ${GITHUB_SHA} is missing"
              exit 1
            fi

            if grep -qi 'Microsoft.SourceLink' <<<"$nuspec"; then
              echo "$package: SourceLink must remain a build-time-only dependency"
              exit 1
            fi

            listing=$(unzip -l "$package")
            for required in 'README\.md' 'LICENSE' 'lib/net10\.0/[^/]+\.dll' 'lib/net10\.0/[^/]+\.xml'; do
              if ! grep -Eq "$required" <<<"$listing"; then
                echo "$package: missing required entry matching $required"
                exit 1
              fi
            done

            symbols="${package%.nupkg}.snupkg"
            if [[ ! -f "$symbols" ]]; then
              echo "$symbols: symbol package is missing"
              exit 1
            fi

            symbol_listing=$(unzip -l "$symbols")
            if ! grep -Eq 'lib/net10\.0/[^/]+\.pdb' <<<"$symbol_listing"; then
              echo "$symbols: PDB entry is missing"
              exit 1
            fi

            pdb=$(mktemp)
            trap 'rm -f "$pdb"' EXIT
            unzip -p "$symbols" 'lib/net10.0/*.pdb' > "$pdb"
            if ! grep -aFq "raw.githubusercontent.com/${SOURCE_REPOSITORY}/${GITHUB_SHA}" "$pdb"; then
              echo "$symbols: SourceLink URL for commit ${GITHUB_SHA} is missing from the PDB"
              exit 1
            fi
            rm -f "$pdb"
            trap - EXIT
          done

          sqlserver_nuspec=$(unzip -p "Mecesoft.Data.EntityFrameworkCore.SqlServer.Tenancy.${version}.nupkg" '*.nuspec')
          if grep -q 'System.Security.Cryptography.Pkcs" version="10.0.13"' <<<"$sqlserver_nuspec"; then
            echo "Pkcs security pin present"
          else
            echo "Pkcs security pin is missing"
            exit 1
          fi

      - name: Local-feed package smoke
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore tests/Mecesoft.Data.PackageSmoke/Mecesoft.Data.PackageSmoke.csproj \
            --configfile tests/Mecesoft.Data.PackageSmoke/NuGet.Config \
            --force --no-cache
          output=$(dotnet run --project tests/Mecesoft.Data.PackageSmoke/Mecesoft.Data.PackageSmoke.csproj \
            -c Release --no-restore)
          echo "$output"
          grep -q '^Mecesoft.Tenant|True|SmokeEntity|' <<<"$output"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
